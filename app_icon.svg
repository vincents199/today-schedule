<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 日历顶栏 -->
  <rect x="96" y="100" width="320" height="60" rx="16" fill="rgba(255,255,255,0.25)"/>

  <!-- 日历格子 -->
  <rect x="96" y="180" width="320" height="220" rx="16" fill="rgba(255,255,255,0.15)"/>
  <line x1="160" y1="180" x2="160" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <line x1="224" y1="180" x2="224" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <line x1="288" y1="180" x2="288" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <line x1="352" y1="180" x2="352" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <line x1="96" y1="250" x2="416" y2="250" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>

  <!-- 装饰小点 -->
  <circle cx="130" cy="130" r="8" fill="rgba(255,255,255,0.5)"/>
  <circle cx="190" cy="130" r="8" fill="rgba(255,255,255,0.5)"/>
  <circle cx="250" cy="130" r="8" fill="rgba(255,255,255,0.5)"/>

  <!-- ♊ 双子座 (蓝色) -->
  <text x="210" y="290" font-family="serif" font-size="90" text-anchor="middle" dominant-baseline="central" fill="#5B8DEF" opacity="0.95">♊</text>

  <!-- ♏ 天蝎座 (粉色) 稍靠右 -->
  <text x="310" y="290" font-family="serif" font-size="90" text-anchor="middle" dominant-baseline="central" fill="#FF8C94" opacity="0.95">♏</text>

  <!-- 底部文字：今天谁干啥 -->
  <text x="256" y="440" font-family="sans-serif" font-size="50" text-anchor="middle" fill="white" font-weight="700" letter-spacing="6">今天谁干啥</text>
</svg>
